name: Publicar Help Vet no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Preparar o site estático
        shell: bash
        run: |
          mkdir -p _site
          cat > site.b64 <<'SITE_ARCHIVE'
          
          SITE_ARCHIVE
          base64 --decode site.b64 | tar -xz -C _site

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar os arquivos do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar o site
        id: deployment
        uses: actions/deploy-pages@v5
