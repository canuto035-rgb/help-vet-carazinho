name: Publicar Help Vet no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v6

      - name: Preparar o site estático
        shell: bash
        run: |
          mkdir -p _site
          tar -xzf site.tar.gz -C _site
          # O GitHub Pages já publica o artefato sob /help-vet-carazinho/.
          # Os arquivos do build precisam ficar na raiz do artefato para que
          # /help-vet-carazinho/_next/... encontre os estilos e scripts.
          if [ -d _site/help-vet-carazinho/_next ]; then
            mv _site/help-vet-carazinho/_next _site/_next
            rmdir _site/help-vet-carazinho
          fi

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar os arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar o site
        id: deployment
        uses: actions/deploy-pages@v4
